<style>
  :root{
    --bg:#212121; --bubble:#303030; --txt:#ececec; --txt-dim:#9a9a9a;
    --line:#3a3a3a; --green:#19c37d; --red:#f04438; --wa:#25d366;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  #canvas{position:relative;width:540px;height:960px;background:#000;overflow:hidden;
    transform-origin:center center}

  /* ── celular ─────────────────────────────────────────── */
  #phone{position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(.945);transform-origin:center center;
    width:492px;height:988px;padding:14px;border-radius:52px;
    background:linear-gradient(150deg,#3a3d42 0%,#15171a 34%,#101215 62%,#41454b 100%);
    box-shadow:0 0 0 1.5px #0a0b0d, 0 26px 60px rgba(0,0,0,.65)}
  #canvas.safe #phone{top:4%;transform:translate(-50%,0) scale(.715);transform-origin:top center}
  #phone::after{content:"";position:absolute;inset:6px;border-radius:47px;
    border:1px solid rgba(255,255,255,.09);pointer-events:none}
  .side{position:absolute;right:-3px;width:3px;border-radius:0 3px 3px 0;
    background:linear-gradient(90deg,#22252a,#4a4f56)}
  .vol-up{top:210px;height:66px} .vol-dn{top:290px;height:66px} .power{top:400px;height:96px}
  .cam{position:absolute;top:24px;left:50%;transform:translateX(-50%);
    width:13px;height:13px;border-radius:50%;background:#05060a;
    box-shadow:inset 0 0 0 1.5px #1d2026;z-index:6}

  #stage{width:464px;height:960px;background:var(--bg);color:var(--txt);
    position:relative;overflow:hidden;border-radius:38px}

  /* ── barra de estado ─────────────────────────────────── */
  .status{height:34px;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;font-size:14px;letter-spacing:.2px}
  .status .right{display:flex;align-items:center;gap:7px}
  .batt{display:flex;align-items:center;gap:4px;color:var(--red);font-size:12px;font-weight:500}
  .batt .shell{width:22px;height:11px;border:1.5px solid var(--red);border-radius:3px;
    position:relative;display:inline-block}
  .batt .shell::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;
    background:var(--red);border-radius:0 1px 1px 0}
  .batt .fill{position:absolute;left:1px;top:1px;bottom:1px;width:3px;background:var(--red);border-radius:1px}

  /* ── encabezado ──────────────────────────────────────── */
  .head{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px}
  .head .back{font-size:22px;line-height:1}
  .head .ava{width:30px;height:30px;border-radius:50%;background:#5b6b8c;color:#fff;
    display:none;place-items:center;font-size:13px;font-weight:700}
  .head.wa .ava{display:grid}
  .head .title{font-size:17px;font-weight:500;display:flex;align-items:center;gap:6px}
  .head .title span{font-size:11px;color:var(--txt-dim)}

  /* ── mensajes ────────────────────────────────────────── */
  .feed{position:absolute;top:86px;bottom:96px;left:0;right:0;
    padding:18px 16px 8px;display:flex;flex-direction:column;gap:18px;
    overflow:hidden;justify-content:flex-end}
  .row{display:flex;flex-direction:column}
  .row.me{align-items:flex-end}
  .me .bubble{background:var(--bubble);border-radius:22px;padding:12px 16px;
    max-width:84%;font-size:17px;line-height:1.45;word-wrap:break-word}
  .meta{font-size:12px;color:var(--txt-dim);margin-top:5px;padding-right:6px}
  .meta b{color:#4fc3f7;font-weight:700}
  .ai{display:flex;gap:12px;align-items:flex-start}
  .ai .mark{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--txt);
    flex:0 0 26px;display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:2px}
  .ai.wa .mark{border:0;background:var(--wa);color:#0b2a16}
  .ai .body{font-size:17px;line-height:1.5;max-width:88%}
  .lead{font-size:17px;line-height:1.5}

  .dots{display:flex;gap:5px;align-items:center;height:22px;margin-top:4px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--txt);display:block;animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .upsell{border:1px solid var(--line);border-radius:16px;padding:16px;background:#262626;margin-top:14px}
  .upsell h4{font-size:16px;font-weight:600;margin-bottom:6px}
  .upsell p{font-size:14px;color:var(--txt-dim);line-height:1.45;margin-bottom:14px}
  .upsell button{width:100%;border:0;border-radius:999px;padding:11px 0;
    background:var(--txt);color:#111;font-size:15px;font-weight:600;font-family:inherit}

  /* ── barra de escritura ──────────────────────────────── */
  .composer{position:absolute;left:0;right:0;bottom:0;padding:12px 14px 22px;background:var(--bg)}
  .field{display:flex;align-items:flex-end;gap:10px;background:#303030;border-radius:26px;
    padding:11px 14px;min-height:48px}
  .field .plus{color:var(--txt-dim);font-size:22px;line-height:1;padding-bottom:1px}
  .field .text{flex:1;font-size:16px;line-height:1.4;max-height:170px;overflow:hidden;
    white-space:pre-wrap;word-wrap:break-word}
  .field .text.empty::after{content:"Pregunta lo que quieras";color:var(--txt-dim)}
  .caret{display:inline-block;width:2px;height:17px;background:var(--green);
    vertical-align:-3px;margin-left:1px;animation:caret .9s step-end infinite}
  @keyframes caret{50%{opacity:0}}
  .field .send{width:32px;height:32px;border-radius:50%;background:var(--txt);color:#111;
    display:grid;place-items:center;font-size:16px;font-weight:700;opacity:.35;transition:opacity .18s}
  .field .send.on{opacity:1}
  .pop{animation:pop .22s ease-out}
  @keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}

  /* ── diálogo de batería ──────────────────────────────── */
  #toast{position:absolute;inset:0;z-index:5;display:grid;place-items:center;
    background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .28s;border-radius:38px}
  #toast.on{opacity:1}
  #toast .dlg{width:80%;background:#2e3033;border-radius:28px;padding:26px 22px 14px;text-align:center;

  #toast.on .dlg{transform:scale(1)}
  #toast .bico{width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;
    margin:0 auto 16px;display:grid;place-items:center;font-size:24px;font-weight:700}
  #toast .t1{font-size:19px;font-weight:600;margin-bottom:8px}
  #toast .t2{font-size:15px;color:var(--txt-dim);line-height:1.45}
  #toast .acts{display:flex;justify-content:flex-end;gap:6px;margin-top:20px}
  #toast .acts span{font-size:15px;font-weight:600;color:#8ab4f8;padding:9px 12px;
    border-radius:999px;transition:background .12s;position:relative;overflow:hidden}
  #toast .acts span.tap{background:rgba(138,180,248,.30)}
  .rip{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;
    border-radius:50%;background:#8ab4f8;opacity:0;transform:scale(0);pointer-events:none}
  #cancel.tap .rip{animation:rip .52s ease-out forwards}
  @keyframes rip{0%{transform:scale(0);opacity:.55}60%{opacity:.32}100%{transform:scale(1);opacity:0}}

  /* ── notificaciones ─────────────────────────────────── */
  #notes{position:absolute;top:10px;left:10px;right:10px;z-index:7;
    display:flex;flex-direction:column;gap:9px}
  .note{background:#2b2b2b;border-radius:20px;padding:13px 16px;display:flex;gap:12px;

  #slate .rule{width:64px;height:4px;background:var(--red);margin:22px auto 0;border-radius:2px}

  #guides .lbl{position:absolute;bottom:21%;left:8px;transform:translateY(-6px);

  /* ── controles ──────────────────────────────────────── */
  #ui{position:fixed;left:0;right:0;bottom:0;padding:9px 12px;background:#0d0d0d;color:#ddd;
    font-size:12px;display:flex;column-gap:7px;row-gap:7px;align-items:center;flex-wrap:wrap;

  #ui b{color:#fff}
  #ui button,#ui label{background:#242424;color:#eee;border:1px solid #383838;border-radius:8px;

  #ui button:hover,#ui label:hover{background:#2f2f2f}
  #ui button.sel{background:#eee;color:#111;border-color:#eee}
  #ui button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  #ui .sep{width:1px;height:20px;background:#2a2a2a}
  #ui input[type=file]{display:none}
  .hide{display:none!important}
  @media (prefers-reduced-motion:reduce){.pop{animation:none}}

/* ── sonido generado por código ────────────────────────────── */
let AC = null, master = null, sfxOn = true, clockTimer = null;
function ac(){
  if (!AC){
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = sfxOn ? 0.35 : 0;
    master.connect(AC.destination);
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function osc(f0, f1, dur, type, vol, cutoff){
  try{
    const a = ac(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (cutoff){
      const lp = a.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = cutoff;
      o.connect(lp); node = lp;
    }
    node.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
const sfx = {
  key:   () => osc(1600, 1200, 0.018, "square", 0.05),
  tap:   () => osc(1000, 700,  0.05,  "sine",   0.14),
  send:  () => osc(700, 1400,  0.09,  "sine",   0.12),
  alert: () => { osc(880, 880, 0.14, "sine", 0.18); setTimeout(() => osc(660, 660, 0.20, "sine", 0.18), 160); },
  note:  () => { osc(1046, 1046, 0.10, "sine", 0.16); setTimeout(() => osc(1568, 1568, 0.16, "sine", 0.14), 90); },
  oficial: () => { osc(523, 523, 0.13, "triangle", 0.16); setTimeout(() => osc(392, 392, 0.28, "triangle", 0.16), 140); },
  slate: () => { osc(80, 45, 0.45, "sine", 0.34); osc(180, 60, 0.22, "triangle", 0.10); },
  power: () => osc(320, 38, 1.30, "sawtooth", 0.22, 900),
  tick:  () => osc(2100, 1700, 0.012, "square", 0.07),
  clockOn: () => {
    if (clockTimer) return;
    sfx.tick();
    clockTimer = setInterval(() => sfx.tick(), 620 / speed);
  },
  clockOff: () => { clearInterval(clockTimer); clockTimer = null; }
};
addEventListener("pointerdown", ac, {once:true});
addEventListener("keydown", ac, {once:true});

const sleep = ms => new Promise(r => setTimeout(r, ms / speed));

let gate = null;
function holdTyping(){
  let release;
  gate = new Promise(r => release = r);
  return () => { gate = null; release(); };
}

function fit(){
  const bar = $("ui");
  const uiH = bar.classList.contains("hide") ? 0 : bar.offsetHeight + 6;
  canvas.style.transform = "scale(" + Math.min(innerWidth/540, (innerHeight-uiH)/960) + ")";
}
addEventListener("resize", fit);

async function type(el, str, base){
  el.textContent = "";
  const caret = document.createElement("i");
  caret.className = "caret";
  let i = 0;
  for (const ch of Array.from(str)){
    if (gate){ el.appendChild(caret); await gate; }
    el.textContent += ch;
    if (el === input && ch !== " " && (i++ % 2 === 0)) sfx.key();
    el.appendChild(caret);
    let d = base + Math.random() * base * 0.9;
    if (ch === " ") d *= 0.5;
    await sleep(d);
    caret.remove();
  }
  el.appendChild(caret);
  return caret;
}

async function batteryDialog(me){
  if (me !== run) return;
  const resume = holdTyping();
  sfx.alert();
  toast.classList.add("on");
  await sleep(4500);
  if (me !== run){ resume(); return; }
  sfx.tap();
  cancel.classList.add("tap");
  await sleep(520);
  if (me !== run){ resume(); return; }
  toast.classList.remove("on");
  await sleep(350);
  cancel.classList.remove("tap");
  resume();
}

/* ── intérprete de beats ──────────────────────────────────── */
async function runCase(c, me){
  sfx.clockOff();
  feed.innerHTML = "";
  notes.innerHTML = "";
  input.textContent = "";
  input.classList.add("empty");
  send.classList.remove("on");
  toast.classList.remove("on");
  cancel.classList.remove("tap");
  off.classList.remove("on","gone");
  gate = null;
  pct.textContent = "3%";
  htitle.firstChild.textContent = c.head.title + " ";
  hsub.textContent = c.head.sub;
  head.classList.toggle("wa", !!c.head.wa);
  await sleep(700);
  if (me !== run) return;

  let lastRow = null;

  for (const b of c.beats){
    if (me !== run) return;

    if (b.t === "user"){
      if (b.dialog) setTimeout(() => batteryDialog(me), 2200 / speed);
      input.classList.remove("empty");
      const caret = await type(input, b.text, b.pace || 34);
      if (me !== run) return;
      send.classList.add("on");
      await sleep(620);
      if (me !== run) return;
      caret.remove();
      sfx.send();
      input.textContent = "";
      input.classList.add("empty");
      send.classList.remove("on");
      lastRow = document.createElement("div");
      lastRow.className = "row me pop";
      lastRow.innerHTML = '<div class="bubble"></div>';
      lastRow.firstChild.textContent = b.text;
      feed.appendChild(lastRow);
      await sleep(900);
    }

    else if (b.t === "meta" && lastRow){
      const m = document.createElement("div");
      m.className = "meta pop";
      m.innerHTML = (b.vist ? '<b>✓✓</b> ' : '') + b.text;
      lastRow.appendChild(m);
    }

    else if (b.t === "ai" || b.t === "aiCut"){
      const ai = document.createElement("div");
      ai.className = "ai pop" + (b.wa ? " wa" : "");
      ai.innerHTML = '<div class="mark">' + (b.wa ? "✆" : "✳") +
        '</div><div class="body"><div class="dots"><i></i><i></i><i></i></div></div>';
      feed.appendChild(ai);
      sfx.clockOn();
      await sleep(b.think || 1600);
      sfx.clockOff();
      if (me !== run) return;
      const body = ai.querySelector(".body");
      if (b.t === "ai"){
        body.innerHTML = "";
        await type(body, b.text, 22);
        if (me !== run) return;
        body.querySelector(".caret")?.remove();
        await sleep(1100);
      } else {
        body.innerHTML = '<div class="lead"></div>';
        const lead = body.querySelector(".lead");
        await type(lead, b.lead, 22);
        if (me !== run) return;
        await sleep(500);
        if (me !== run) return;
        lead.querySelector(".caret")?.remove();
        const card = document.createElement("div");
        card.className = "upsell pop";
        card.innerHTML = '<h4></h4><p></p><button></button>';
        card.querySelector("h4").textContent = b.card.h;
        card.querySelector("p").textContent = b.card.p;
        card.querySelector("button").textContent = b.card.cta;
        body.appendChild(card);
      }
    }

    else if (b.t === "note"){
      if (b.lead) await sleep(b.lead);
      if (me !== run) return;
      const n = document.createElement("div");
      n.className = "note" + (b.kind === "of" ? " of" : "");
      n.innerHTML = '<div class="wico">' + (b.kind === "of" ? "i" : "✆") +
        '</div><div><div class="who"></div><div class="msg"></div></div>';
      n.querySelector(".who").textContent = b.who;
      n.querySelector(".msg").textContent = b.msg;
      notes.appendChild(n);
      if (b.kind === "of") sfx.oficial(); else sfx.note();
      requestAnimationFrame(() => n.classList.add("on"));
      await sleep(b.wait || 2300);
    }

    else if (b.t === "batt"){ pct.textContent = b.pct; await sleep(900); }
    else if (b.t === "wait"){ await sleep(b.ms); }
    else if (b.t === "off"){
      sfx.clockOff();
      sfx.power();
      off.classList.add("on");
      await sleep(2600);
      if (me !== run) return;
      off.classList.add("gone");
      await sleep(1800);
    }
  }
}

async function showSlate(n, titulo, me){
  sfx.slate();
  $("snum").textContent = n;
  $("sttl").textContent = titulo;
  slate.classList.add("on","fade");
  await sleep(2400);
  slate.classList.remove("on","fade");
  if (me !== run) return false;
  await sleep(300);
  return me === run;
}

async function showPhoto(me){
  if (!photoURL) return me === run;
  photo.classList.add("on");
  await sleep(2200);
  photo.classList.remove("on");
  if (me !== run) return false;
  await sleep(300);
  return me === run;
}

async function play(){
  const me = ++run;
  slate.classList.remove("on");
  photo.classList.remove("on");

  if (mode === "one"){
    if (!(await showSlate(only + 1, CASES[only].titulo, me))) return;
    await runCase(CASES[only], me);
    if (me !== run) return;
    await sleep(1200);
    if (me === run) play();
    return;
  }

  for (let i = 0; i < CASES.length; i++){
    if (!(await showSlate(i + 1, CASES[i].titulo, me))) return;
    await runCase(CASES[i], me);
    if (me !== run) return;
    if (i < CASES.length - 1){
      if (!(await showPhoto(me))) return;
    }
  }
  await sleep(1500);
  if (me === run) play();
}

/* ── controles ────────────────────────────────────────────── */
$("all").onclick = () => { mode = "all"; marca("all"); play(); };
document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
  mode = "one"; only = +b.dataset.c; marca(b); play();
});
function marca(el){
  const t = typeof el === "string" ? $(el) : el;
  $("all").classList.toggle("sel", t === $("all"));
  document.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("sel", x === t));
}
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
  speed = +b.dataset.s;
  document.querySelectorAll("[data-s]").forEach(x => x.classList.toggle("sel", x === b));
});
$("file").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  if (photoURL) URL.revokeObjectURL(photoURL);
  photoURL = URL.createObjectURL(f);
  pimg.src = photoURL;
};
$("sound").onclick = toggleSound;
$("safe").onclick = toggleSafe;

function toggleSound(){
  sfxOn = !sfxOn;
  ac();
  if (master) master.gain.value = sfxOn ? 0.35 : 0;
  if (!sfxOn) sfx.clockOff();
  $("sound").classList.toggle("sel", sfxOn);
  $("sound").textContent = (sfxOn ? "🔊" : "🔇") + " Sonido (M)";
}
$("grid").onclick = toggleGuides;
$("again").onclick = play;
$("hide").onclick = toggleUI;

function toggleSafe(){ $("safe").classList.toggle("sel", canvas.classList.toggle("safe")); }
function toggleGuides(){ $("grid").classList.toggle("sel", guides.classList.toggle("on")); }
function toggleUI(){ $("ui").classList.toggle("hide"); fit(); }

addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "r") play();
  if (k === "h") toggleUI();
  if (k === "s") toggleSafe();
  if (k === "g") toggleGuides();
  if (k === "m") toggleSound();
});

fit();
play();
</script>
